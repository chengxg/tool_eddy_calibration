# 小螃蟹涡流对刀项目 https://github.com/chengxg/tool_eddy_calibration
# 换热端项目涡流对刀配置 https://github.com/cx330-TXY/Simple-Multi-Hotend
# 首次批量寻找线圈中心: FIND_ALL_TOOL_EDDY_COIL_CENTERS
# 寻找单个工具线圈中心: FIND_TOOL_EDDY_COIL_CENTER TOOL=0
# 批量校准所有工具偏移: CALIBRATE_ALL_TOOLS_EDDY
# 校准单个工具偏移:     CALIBRATE_TOOL_EDDY TOOL=0
# 查询校准结果:         GET_TOOL_CENTER TOOL=0
# 清除校准数据:         CLEAR_TOOL_CENTER TOOL=0
# 每个工具/通道的线圈中心保存为 t{tool}_coil_x_{channel}、t{tool}_coil_y_{channel}

[tool_eddy_calibration calibrator_xy]
sensor_type: ldc1612
frequency: 40000000
max_sensor_hz: 7000000        # 线圈最大频率
# LDC1612 I2C 配置
i2c_speed: 400000
i2c_address: 42               # 地址跳线连接
i2c_mcu: mcu                  # 改成自己的
i2c_software_scl_pin: SCL     # 改成自己的
i2c_software_sda_pin: SDA     # 改成自己的

# 线圈0参数 (默认通道)
reg_drive_current: 22         # 线圈0驱动电流, 用校准命令后可不写
coil_z: 0.0                   # 改成自己的 线圈平面的Z坐标位置
find_coil_region: 10,0,26,12  # 改成自己的 搜索区域 xmin,ymin,xmax,ymax
coil_inner_diameter: 2.0      # 线圈内径
scan_height: 0.4              # 扫描高度, 以coil_z为基准再提高的高度, 喷嘴距线圈约0.5mm
scan_speed: 4.0               # 扫描速度, 速度低了效果不一定好
scan_length: 6.0              # 扫描长度, 至少要覆盖线圈内径
scan_safe_z: 2.0              # 安全Z高度, 比scan_height高就行

# 线圈1参数 (单线圈模块整段删除)
reg_drive_current1: 25        # 线圈1驱动电流
coil_z1: 0.2                  # 改成自己的 线圈平面的Z坐标位置
find_coil_region1: 20,0,40,18 # 改成自己的 通道1搜索区域
coil_inner_diameter1: 4       # 线圈内径
scan_height1: 0.6             # 扫描高度, 以coil_z1为基准再提高的高度
scan_speed1: 4.0              # 扫描速度
scan_length1: 10.0            # 扫描长度, 至少要覆盖线圈内径

# 通用参数
travel_speed_xy: 100.0        # XY旅行速度
travel_speed_z: 10.0          # Z旅行速度
save_data: True               # 保存扫描数据到配置同级 tool_eddy_calibration/ 目录

[gcode_macro _TOOL_CALIB_VARS_EDDY]
variable_safe_x: 20.0         # 改成自己的 换刀/待机的安全区域X 喷嘴戳热床位置
variable_safe_y: 35.0         # 改成自己的 换刀/待机的安全区域Y 喷嘴戳热床位置
variable_safe_z: 5.0          # 改成自己的 换刀/待机的安全区域Z高度
variable_tool_count: 5        # 改成自己的 工具总数 (T0..T{N-1})
variable_eddy_channel: 0      # 校准所用线圈通道
variable_refine_radius: 3.0   # 重找线圈中心的收缩半径 (±mm), 需大于工具间最大偏移
gcode:
    # 此处无需指令，仅用于存储变量

[gcode_macro SAVE_TOOL_EDDY_COIL_CENTER]
gcode:
    {% set tool = params.TOOL|default(none) %}
    {% set channel = params.CHANNEL|default(none) %}
    {% set eddy = printer["tool_eddy_calibration calibrator_xy"] %}
    {% if tool is none or channel is none %}
        {action_raise_error("TOOL and CHANNEL are required")}
    {% endif %}
    {% if 'coil_center' not in eddy %}
        {action_raise_error("Run TOOL_EDDY_FIND_COIL REGION=... first")}
    {% endif %}
    {% if eddy.coil_center.channel != channel|int %}
        {action_raise_error("Last found coil channel does not match CHANNEL=" ~ channel)}
    {% endif %}
    SAVE_VARIABLE VARIABLE=t{tool}_coil_x_{channel} VALUE={eddy.coil_center.x|round(4)}
    SAVE_VARIABLE VARIABLE=t{tool}_coil_y_{channel} VALUE={eddy.coil_center.y|round(4)}
    {action_respond_info("Saved T" ~ tool ~ " coil center for channel " ~ channel)}

# ---------------------------------------------------------
# 寻找单个工具在指定通道的线圈中心，并保存到 save_variables
# 调用示例: FIND_TOOL_EDDY_COIL_CENTER TOOL=1 CHANNEL=0
# T0 基准工具: 始终用配置的 find_coil_region 搜索, 不缩放。
# 其他工具: 忽略自身历史中心；以 T0 已保存中心为区域中心，使用
# variable_refine_radius 作为 ±X/±Y 的缩小搜索半径。
# ---------------------------------------------------------
[gcode_macro FIND_TOOL_EDDY_COIL_CENTER]
gcode:
    {% set tool = params.TOOL|default(0)|int %}
    {% set vars = printer["gcode_macro _TOOL_CALIB_VARS_EDDY"] %}
    {% set channel = params.CHANNEL|default(vars.eddy_channel)|int %}
    {% set radius = vars.refine_radius|float %}
    {% set svv = printer.save_variables.variables %}
    {% set x0key = "t0_coil_x_" ~ channel %}
    {% set y0key = "t0_coil_y_" ~ channel %}
    G1 X{vars.safe_x} Y{vars.safe_y} Z{vars.safe_z} F9000
    T{tool}
    SET_GCODE_OFFSET X=0 Y=0 Z=0 MOVE=0
    G1 X{vars.safe_x} Y{vars.safe_y} Z{vars.safe_z} F9000
    {% if tool != 0 and x0key in svv and y0key in svv %}
        # 只使用 T0 结果，以 refine_radius 缩小区域；不读取当前工具旧值。
        {% set rawXMin = svv[x0key] - radius %}
        {% set rawXMax = svv[x0key] + radius %}
        {% set rawYMin = svv[y0key] - radius %}
        {% set rawYMax = svv[y0key] + radius %}
        {% set axisMinX = printer.toolhead.axis_minimum.x %}
        {% set axisMaxX = printer.toolhead.axis_maximum.x %}
        {% set axisMinY = printer.toolhead.axis_minimum.y %}
        {% set axisMaxY = printer.toolhead.axis_maximum.y %}
        {% set shiftX = (axisMinX - rawXMin) if rawXMin < axisMinX else ((axisMaxX - rawXMax) if rawXMax > axisMaxX else 0) %}
        {% set shiftY = (axisMinY - rawYMin) if rawYMin < axisMinY else ((axisMaxY - rawYMax) if rawYMax > axisMaxY else 0) %}
        # 超出行程时仅将整块缩小区域移回行程内，宽高不变。
        TOOL_EDDY_FIND_COIL CHANNEL={channel} REGION={rawXMin + shiftX},{rawYMin + shiftY},{rawXMax + shiftX},{rawYMax + shiftY}
    {% else %}
        # T0 基准 / T0 中心未保存: 使用配置的原始区域
        TOOL_EDDY_FIND_COIL CHANNEL={channel}
    {% endif %}
    SAVE_TOOL_EDDY_COIL_CENTER TOOL={tool} CHANNEL={channel}
    G1 X{vars.safe_x} Y{vars.safe_y} Z{vars.safe_z} F9000

# ---------------------------------------------------------
# 批量寻找并保存全部工具的线圈中心
# (T0 使用原始区域, 其余工具以 T0 中心 ±refine_radius 缩放区域)
# 调用示例: FIND_ALL_TOOL_EDDY_COIL_CENTERS [CHANNEL=]
# ---------------------------------------------------------
[gcode_macro FIND_ALL_TOOL_EDDY_COIL_CENTERS]
gcode:
    {% set vars = printer["gcode_macro _TOOL_CALIB_VARS_EDDY"] %}
    {% set channel = params.CHANNEL|default(vars.eddy_channel)|int %}
    {action_respond_info("开始批量寻找工具线圈中心...")}
    T0
    {% for tool in range(0, vars.tool_count) %}
        FIND_TOOL_EDDY_COIL_CENTER TOOL={tool} CHANNEL={channel}
    {% endfor %}
    untool
    {action_respond_info("全部工具线圈中心已保存")}

# ---------------------------------------------------------
# 校准单个工具 (XY, 换喷嘴/撞车后重跑)
# 调用示例: CALIBRATE_TOOL_EDDY TOOL=0
# ---------------------------------------------------------
[gcode_macro CALIBRATE_TOOL_EDDY]
gcode:
    {% set tool = params.TOOL|default(0)|int %}
    {% set vars = printer["gcode_macro _TOOL_CALIB_VARS_EDDY"] %}

    G1 X{vars.safe_x} Y{vars.safe_y} Z{vars.safe_z} F9000
    T{tool}
    SET_GCODE_OFFSET X=0 Y=0 Z=0 MOVE=0
    G1 X{vars.safe_x} Y{vars.safe_y} Z{vars.safe_z} F9000
    M109 S150 T{tool}          # 加热到150度
    # CLEAN_NOZZLE # 看情况自己设置磨嘴, 要不然不准
    # 使用能够喷嘴限位的probe得到Z偏移, 涡流tap或者压力床测量
    PROBE METHOD=tap SAMPLES=3
    G1 X{vars.safe_x} Y{vars.safe_y} Z{vars.safe_z} F9000
    DO_CALIBRATE_TOOL_EDDY TOOL={tool} CHANNEL={vars.eddy_channel}
    _DO_SAVE_CALIB_RESULT_EDDY TOOL={tool}
    M400                       # 【关键】等待动作走完
    G90

[gcode_macro DO_CALIBRATE_TOOL_EDDY]
gcode:
    {% set tool = params.TOOL|default(0)|int %}
    {% set channel = params.CHANNEL|default(0)|int %}
    {% set probeZ = printer.probe.last_probe_position.z %}
    {% set centerXKey = "t" ~ tool ~ "_coil_x_" ~ channel %}
    {% set centerYKey = "t" ~ tool ~ "_coil_y_" ~ channel %}
    {% set centerX = printer.save_variables.variables[centerXKey]|default(none) %}
    {% set centerY = printer.save_variables.variables[centerYKey]|default(none) %}
    {% if centerX is none or centerY is none %}
        {action_raise_error("Run FIND_TOOL_EDDY_COIL_CENTER TOOL=" ~ tool ~ " CHANNEL=" ~ channel ~ " first")}
    {% endif %}
    # 清除上次的中心点位置
    CLEAR_TOOL_CENTER TOOL={tool}
    # 设置使用喷嘴限位的probe探测到的Z位置
    SET_TOOL_Z TOOL={tool} Z={probeZ}
    # T0 的参考Z: 优先本会话内存数据, 重启后从 save_variables 兜底
    {% set tool0ProbeZ = printer.save_variables.variables.t0_z|default(0.0) %}
    {% if '0' in printer["tool_eddy_calibration calibrator_xy"] %}
        {% set tool0ProbeZ = printer["tool_eddy_calibration calibrator_xy"]["0"].z %}
    {% endif %}
    # 进行XY偏移校准, 设置一个相对于tool0的z偏移, 避免喷嘴碰到线圈
    TOOL_EDDY_CALIBRATE TOOL={tool} CENTER_XY={centerX},{centerY} DIR=45,135 PAIR_CANCEL=0 SCAN_HEIGHT_OFFSET={probeZ-tool0ProbeZ} CHANNEL={channel}

# 保存校准结果 (XY) 到 save_variables
# 基准值优先取本会话 T0 内存数据, 重启后单独重校某工具时从 save_variables 兜底
[gcode_macro _DO_SAVE_CALIB_RESULT_EDDY]
gcode:
    {% set tool = params.TOOL|int %}
    {% set eddy = printer["tool_eddy_calibration calibrator_xy"] %}
    {% set res = eddy[tool|string] %}
    {% if '0' in eddy %}
        {% set res0 = eddy['0'] %}
    {% else %}
        {% set res0 = {'x': printer.save_variables.variables.t0_x|default(0.0),
                       'y': printer.save_variables.variables.t0_y|default(0.0),
                       'z': printer.save_variables.variables.t0_z|default(0.0)} %}
    {% endif %}

    {% if tool == 0 %}
        # T0 永远存 0, 同时记下绝对坐标供日后单独重校其他工具用
        SAVE_VARIABLE VARIABLE=t0_offset_x VALUE=0.0
        SAVE_VARIABLE VARIABLE=t0_offset_y VALUE=0.0
        SAVE_VARIABLE VARIABLE=t0_offset_z VALUE=0.0
        SAVE_VARIABLE VARIABLE=t0_x VALUE={res.x|round(4)}
        SAVE_VARIABLE VARIABLE=t0_y VALUE={res.y|round(4)}
        SAVE_VARIABLE VARIABLE=t0_z VALUE={res.z|round(4)}
        {action_respond_info("✅ T0 基准点坐标已锁定")}
    {% else %}
        # 其他工具存探测结果 (相对 T0 的偏移)
        SAVE_VARIABLE VARIABLE=t{tool}_offset_x VALUE={(res.x-res0.x)|round(4)}
        SAVE_VARIABLE VARIABLE=t{tool}_offset_y VALUE={(res.y-res0.y)|round(4)}
        SAVE_VARIABLE VARIABLE=t{tool}_offset_z VALUE={(res.z-res0.z)|round(4)}
        SAVE_VARIABLE VARIABLE=t{tool}_x VALUE={res.x|round(4)}
        SAVE_VARIABLE VARIABLE=t{tool}_y VALUE={res.y|round(4)}
        SAVE_VARIABLE VARIABLE=t{tool}_z VALUE={res.z|round(4)}
        {action_respond_info("✅ T" ~ tool ~ " 偏移量已自动保存")}
    {% endif %}

# ---------------------------------------------------------
# 批量校准所有工具 (XY)
# 调用示例: CALIBRATE_ALL_TOOLS_EDDY
# 每组最多同时预热 3 个热端; 完成该组校准后先关组内热端,
# 再开始下一组, 避免多热端同时加热超过电源功率。
# ---------------------------------------------------------
[gcode_macro CALIBRATE_ALL_TOOLS_EDDY]
gcode:
    {% set vars = printer["gcode_macro _TOOL_CALIB_VARS_EDDY"] %}
    {action_respond_info("开始全自动工具校准流程...")}
    T0
    {% for batch_start in range(0, vars.tool_count, 3) %}
        {% set batch_end = [batch_start + 3, vars.tool_count]|min %}
        {action_respond_info("预热并校准 T" ~ batch_start ~ " 到 T" ~ (batch_end - 1))}
        {% for t in range(batch_start, batch_end) %}
            M104 S150 T{t}
        {% endfor %}
        {% for t in range(batch_start, batch_end) %}
            CALIBRATE_TOOL_EDDY TOOL={t}
        {% endfor %}
        {% for t in range(batch_start, batch_end) %}
            M104 S0 T{t}
        {% endfor %}
    {% endfor %}
    untool
    {action_respond_info("所有工具校准完毕")}
