# 小螃蟹涡流对刀项目 https://github.com/chengxg/tool_eddy_calibration
# 换热端项目涡流对刀配置 https://github.com/cx330-TXY/Simple-Multi-Hotend
# 粗略范围寻找线圈中心 (任一工具执行一次): FIND_TOOL_EDDY_COIL_CENTER TOOL=0
# 批量校准所有工具偏移: CALIBRATE_ALL_TOOLS_EDDY
# 校准单个工具偏移:     CALIBRATE_TOOL_EDDY TOOL=0
# 查询校准结果:         GET_TOOL_CENTER TOOL=0
# 清除校准数据:         CLEAR_TOOL_CENTER TOOL=0
# 线圈中心保存为 coil_x_{channel}/coil_y_{channel} (物理线圈位置, 全工具共用);
# 各工具对刀迭代收敛中心保存为 t{tool}_x_{channel}/t{tool}_y_{channel},
# 校准时无该键则回落共用中心

[tool_eddy_calibration calibrator_xy]
sensor_type: ldc1612
frequency: 40000000
max_sensor_hz: 7000000        # 线圈最大频率
# LDC1612 I2C 配置
i2c_speed: 400000
i2c_address: 42               # 地址跳线连接
i2c_mcu: mcu                  # 改成自己的
i2c_software_scl_pin: SCL     # 改成自己的
i2c_software_sda_pin: SDA     # 改成自己的

# 线圈0参数 (默认通道, 小线圈)
reg_drive_current: 22         # 线圈0驱动电流, 用校准命令后可不写
coil_z: -0.3                  # 改成自己的 线圈平面的Z坐标位置
find_coil_region: 10,0,26,12  # 改成自己的 搜索区域 xmin,ymin,xmax,ymax, 区域不要太大了, 包含线圈外径即可
coil_inner_diameter: 2.0      # 线圈内径
scan_height: 0.4              # 扫描高度, 以coil_z为基准再提高的高度, 喷嘴距线圈约0.5mm
scan_speed: 4.0               # 扫描速度, 速度低了效果不一定好, 最佳速度大概就是4mm/s
scan_length: 6.0              # 扫描长度, 至少要覆盖线圈内径, 也不能太长了
scan_safe_z: 2                # 安全Z高度, 比scan_height高就行

# 线圈1参数 (单线圈模块整段删除), 我的小螃蟹偏移校准有两个线圈
reg_drive_current1: 25        # 线圈1驱动电流
coil_z1: -0.3                  # 改成自己的 线圈平面的Z坐标位置
find_coil_region1: 20,5,35,15 # 改成自己的 搜索区域 xmin,ymin,xmax,ymax, 区域不要太大了, 包含线圈外径即可
coil_inner_diameter1: 4       # 线圈内径
scan_height1: 0.4             # 扫描高度, 以coil_z1为基准再提高的高度
scan_speed1: 4.0              # 扫描速度
scan_length1: 10.0            # 扫描长度, 至少要覆盖线圈内径

# 通用参数
travel_speed_xy: 100.0        # XY旅行速度
travel_speed_z: 10.0          # Z旅行速度
trust_min_r2: 0.992           # 各方向抛物线拟合 R² 须 >= 此值且 < 1.0
save_data: True               # 保存扫描数据到配置同级 tool_eddy_calibration/ 目录, 可以在页面上下载

[gcode_macro _TOOL_CALIB_VARS_EDDY]
variable_safe_x: 20.0         # 改成自己的 换刀/待机的安全区域X 喷嘴戳热床位置
variable_safe_y: 35.0         # 改成自己的 换刀/待机的安全区域Y 喷嘴戳热床位置
variable_safe_z: 5.0          # 改成自己的 换刀/待机的安全区域Z高度
variable_tool_count: 5        # 改成自己的 工具总数 (T0..T{N-1})
variable_eddy_channel: 0      # 当前校准所用线圈通道
variable_probe_temp: 150      # 探测时喷嘴加热温度 (软化残料, 保证 tap 一致性)
gcode:
    # 此处无需指令，仅用于存储变量

[gcode_macro SAVE_TOOL_EDDY_COIL_CENTER]
gcode:
    {% set channel = params.CHANNEL|default(none) %}
    {% set eddy = printer["tool_eddy_calibration calibrator_xy"] %}
    {% if channel is none %}
        {action_raise_error("CHANNEL is required")}
    {% endif %}
    {% if 'coil_center' not in eddy %}
        {action_raise_error("Run TOOL_EDDY_FIND_COIL REGION=... first")}
    {% endif %}
    {% if eddy.coil_center.channel != channel|int %}
        {action_raise_error("Last found coil channel does not match CHANNEL=" ~ channel)}
    {% endif %}
    # 共用中心 (不区分工具): 一次寻找, 全部工具共用
    SAVE_VARIABLE VARIABLE=coil_x_{channel} VALUE={eddy.coil_center.x|round(4)}
    SAVE_VARIABLE VARIABLE=coil_y_{channel} VALUE={eddy.coil_center.y|round(4)}
    {action_respond_info("Saved shared coil center for channel " ~ channel)}

# ---------------------------------------------------------
# 寻找线圈中心 (用任意一个工具执行一次即可, 默认 T0), 保存到 save_variables
# 调用示例: FIND_TOOL_EDDY_COIL_CENTER TOOL=0 [CHANNEL=]
# 流程与 CALIBRATE_TOOL_EDDY 一致: 先加热到 150 度 tap 探测本工具 Z,
# 相对 T0 的差值作为 SCAN_HEIGHT_OFFSET 传给 TOOL_EDDY_FIND_COIL,
# 避免喷嘴较长/较短的刀具扫描时碰撞线圈。
# 搜索区域: 配置的 find_coil_region
# 结果保存为共用的 coil_x_{channel}/coil_y_{channel}, 全部工具共用。
# ---------------------------------------------------------
[gcode_macro FIND_TOOL_EDDY_COIL_CENTER]
gcode:
    {% set tool = params.TOOL|default(0)|int %}
    {% set vars = printer["gcode_macro _TOOL_CALIB_VARS_EDDY"] %}
    {% set channel = params.CHANNEL|default(vars.eddy_channel)|int %}
    G1 X{vars.safe_x} Y{vars.safe_y} Z{vars.safe_z} F9000
    T{tool}
    SET_GCODE_OFFSET X=0 Y=0 Z=0 MOVE=0
    G1 X{vars.safe_x} Y{vars.safe_y} Z{vars.safe_z} F9000
    M109 S{vars.probe_temp} T{tool}  # 加热到探测温度
    PROBE METHOD=tap SAMPLES=3
    G1 X{vars.safe_x} Y{vars.safe_y} Z{vars.safe_z} F9000
    # T0 的参考Z: 优先本会话内存数据, 重启后从 save_variables 兜底
    {% set tool0ProbeZ = printer.save_variables.variables.t0_z|default(0.0) %}
    {% if '0' in printer["tool_eddy_calibration calibrator_xy"] %}
        {% set tool0ProbeZ = printer["tool_eddy_calibration calibrator_xy"]["0"].z %}
    {% endif %}
    {% set zOffset = printer.probe.last_probe_position.z - tool0ProbeZ %}
    TOOL_EDDY_FIND_COIL CHANNEL={channel} SCAN_HEIGHT_OFFSET={zOffset}
    SAVE_TOOL_EDDY_COIL_CENTER CHANNEL={channel}
    G1 X{vars.safe_x} Y{vars.safe_y} Z{vars.safe_z} F9000

# ---------------------------------------------------------
# 校准单个工具 (XY, 换喷嘴/撞车后重跑)
# 调用示例: CALIBRATE_TOOL_EDDY TOOL=0 [TEMP=170]
# TEMP 未传时用 variable_probe_temp
# ---------------------------------------------------------
[gcode_macro CALIBRATE_TOOL_EDDY]
gcode:
    {% set tool = params.TOOL|default(0)|int %}
    {% set vars = printer["gcode_macro _TOOL_CALIB_VARS_EDDY"] %}
    {% set temp = params.TEMP|default(vars.probe_temp)|float %}

    G1 X{vars.safe_x} Y{vars.safe_y} Z{vars.safe_z} F9000
    T{tool}
    SET_GCODE_OFFSET X=0 Y=0 Z=0 MOVE=0
    G1 X{vars.safe_x} Y{vars.safe_y} Z{vars.safe_z} F9000
    M109 S{temp} T{tool}  # 加热到探测温度
    # CLEAN_NOZZLE # 看情况自己设置磨嘴, 要不然不准
    # 使用能够喷嘴限位的probe得到Z偏移, 涡流tap或者压力床测量
    PROBE METHOD=tap SAMPLES=3
    G1 X{vars.safe_x} Y{vars.safe_y} Z{vars.safe_z} F9000
    DO_CALIBRATE_TOOL_EDDY TOOL={tool} CHANNEL={vars.eddy_channel}
    _DO_SAVE_CALIB_RESULT_EDDY TOOL={tool}
    M400                       # 【关键】等待动作走完
    G90

[gcode_macro DO_CALIBRATE_TOOL_EDDY]
gcode:
    {% set tool = params.TOOL|default(0)|int %}
    {% set channel = params.CHANNEL|default(0)|int %}
    {% set probeZ = printer.probe.last_probe_position.z %}
    # 中心基点: 本工具对刀迭代收敛值 (t{n}_x/y_{channel}, 见 _DO_SAVE_CALIB_RESULT_EDDY),
    # 未校准过的工具回落共用的线圈中心 coil_x/y_{channel} (FIND 所存)
    {% set centerXKey = "t" ~ tool ~ "_x_" ~ channel %}
    {% set centerYKey = "t" ~ tool ~ "_y_" ~ channel %}
    {% set svv = printer.save_variables.variables %}
    {% set centerX = svv[centerXKey]|default(svv['coil_x_' ~ channel]|default(none)) %}
    {% set centerY = svv[centerYKey]|default(svv['coil_y_' ~ channel]|default(none)) %}
    {% if centerX is none or centerY is none %}
        {action_raise_error("Run FIND_TOOL_EDDY_COIL_CENTER CHANNEL=" ~ channel ~ " first")}
    {% endif %}
    # 清除上次的中心点位置
    CLEAR_TOOL_CENTER TOOL={tool}
    # 设置使用喷嘴限位的probe探测到的Z位置 (带上 CENTER_XY 回显本次用的中心)
    SET_TOOL_Z TOOL={tool} Z={probeZ} CENTER_XY={centerX},{centerY}
    # T0 的参考Z: 优先本会话内存数据, 重启后从 save_variables 兜底
    {% set tool0ProbeZ = printer.save_variables.variables.t0_z|default(0.0) %}
    {% if '0' in printer["tool_eddy_calibration calibrator_xy"] %}
        {% set tool0ProbeZ = printer["tool_eddy_calibration calibrator_xy"]["0"].z %}
    {% endif %}
    # 进行XY偏移校准, 设置一个相对于tool0的z偏移, 避免喷嘴碰到线圈
    # ITERATIONS=0: 跳过迭代阶段, 只在传入中心终测一轮 (省一半时间);
    # 线圈中心数据新鲜时够用, 中心可能过期时改回 1 让它先收敛
    TOOL_EDDY_CALIBRATE TOOL={tool} CENTER_XY={centerX},{centerY} DIR=45,135 PAIR_CANCEL=0 ITERATIONS=1 SCAN_HEIGHT_OFFSET={probeZ-tool0ProbeZ} CHANNEL={channel}

# 保存校准结果 (XY) 到 save_variables
# 基准值优先取本会话 T0 内存数据, 重启后单独重校某工具时从 save_variables 兜底
# 收敛后的中心同时回写为 t{n}_x/y_{channel}, 下次校准 DO_CALIBRATE
# 直接以它为 CENTER_XY 基点, 无需重跑 FIND_TOOL_EDDY_COIL_CENTER
# 绝对 XY 只存 t{n}_x/y_{channel} 一份 (t{n}_x/y 旧键废弃); t{n}_z 为各工具
# tap 探测 Z (无通道后缀, t0_z 是 tool0ProbeZ 兜底), offset 是换刀用的偏移
[gcode_macro _DO_SAVE_CALIB_RESULT_EDDY]
gcode:
    {% set tool = params.TOOL|int %}
    {% set eddy = printer["tool_eddy_calibration calibrator_xy"] %}
    {% set res = eddy[tool|string] %}
    # 中心回写所用的通道: 校准结果自带, 兜底取宏配置的默认通道
    {% set channel = res.channel|default(printer["gcode_macro _TOOL_CALIB_VARS_EDDY"].eddy_channel)|int %}
    {% if '0' in eddy %}
        {% set res0 = eddy['0'] %}
    {% else %}
        {% set res0 = {'x': printer.save_variables.variables.t0_x_0|default(0.0),
                       'y': printer.save_variables.variables.t0_y_0|default(0.0),
                       'z': printer.save_variables.variables.t0_z|default(0.0)} %}
    {% endif %}

    {% if tool == 0 %}
        # T0 永远存 0, z 存探测值 (tool0ProbeZ 兜底); XY 只存下方回写的 t0_x/y_0
        SAVE_VARIABLE VARIABLE=t0_offset_x VALUE=0.0
        SAVE_VARIABLE VARIABLE=t0_offset_y VALUE=0.0
        SAVE_VARIABLE VARIABLE=t0_offset_z VALUE=0.0
        SAVE_VARIABLE VARIABLE=t0_z VALUE={res.z|round(4)}
        {action_respond_info("✅ T0 基准点坐标已锁定")}
    {% else %}
        # 其他工具存探测结果 (相对 T0 的偏移); XY 绝对值只在下方回写一份
        SAVE_VARIABLE VARIABLE=t{tool}_offset_x VALUE={(res.x-res0.x)|round(4)}
        SAVE_VARIABLE VARIABLE=t{tool}_offset_y VALUE={(res.y-res0.y)|round(4)}
        SAVE_VARIABLE VARIABLE=t{tool}_offset_z VALUE={(res.z-res0.z)|round(4)}
        SAVE_VARIABLE VARIABLE=t{tool}_z VALUE={res.z|round(4)}
        {action_respond_info("✅ T" ~ tool ~ " 偏移量已自动保存")}
    {% endif %}

    # 收敛中心回写为本工具的中心基点, 取代共用的光栅粗值,
    # 下次校准直接用作 CENTER_XY 基点; 不可信结果不回写, 避免污染基点
    {% if res.trusted|default(false) %}
        SAVE_VARIABLE VARIABLE=t{tool}_x_{channel} VALUE={res.x|round(4)}
        SAVE_VARIABLE VARIABLE=t{tool}_y_{channel} VALUE={res.y|round(4)}
        {action_respond_info("✅ T" ~ tool ~ " 收敛中心已回写为通道 " ~ channel ~ " 的本工具基点")}
    {% else %}
        {action_respond_info("⚠️ T" ~ tool ~ " 结果不可信, 保留原中心基点数据")}
    {% endif %}

# ---------------------------------------------------------
# 批量校准工具 (XY)
# 调用示例: CALIBRATE_ALL_TOOLS_EDDY [TEMP=150] [TOOLS=0,2,3]
# TEMP  未传时用 variable_probe_temp
# TOOLS 逗号分隔的工具号子集; 未传时校准全部 T0..T{N-1}
# 每组最多同时预热 3 个热端; 完成该组校准后先关组内热端,
# 再开始下一组, 避免多热端同时加热超过电源功率。
# ---------------------------------------------------------
[gcode_macro CALIBRATE_ALL_TOOLS_EDDY]
gcode:
    {% set vars = printer["gcode_macro _TOOL_CALIB_VARS_EDDY"] %}
    {% set temp = params.TEMP|default(vars.probe_temp)|float %}
    {% set tools_str = params.TOOLS|default('')|string %}
    {% if tools_str %}
        {% set tools = tools_str.split(',')|map('int')|list %}
    {% else %}
        {% set tools = range(vars.tool_count)|list %}
    {% endif %}
    {% for t in tools %}
        {% if t < 0 or t >= vars.tool_count %}
            {action_raise_error("TOOLS 含无效工具号 T" ~ t ~ " (有效范围 T0..T" ~ (vars.tool_count - 1) ~ ")")}
        {% endif %}
    {% endfor %}
    {action_respond_info("开始自动校准工具: T" ~ tools|join(", T") ~ " @ " ~ temp ~ "℃")}
    T0
    {% for batch_start in range(0, tools|length, 3) %}
        {% set batch = tools[batch_start:batch_start + 3] %}
        {action_respond_info("预热并校准 T" ~ batch|join(", T"))}
        {% for t in batch %}
            M104 S{temp} T{t}
        {% endfor %}
        {% for t in batch %}
            CALIBRATE_TOOL_EDDY TOOL={t} TEMP={temp}
        {% endfor %}
        {% for t in batch %}
            M104 S0 T{t}
        {% endfor %}
    {% endfor %}
    untool
    {action_respond_info("工具校准完毕 (T" ~ tools|join(", T") ~ ")")}