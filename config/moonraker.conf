# Moonraker 自动更新配置
# 将本节追加到 moonraker.conf, 之后可在前端 (Mainsail/Fluidd) 的更新页面
# 检查并更新本插件, 更新后 Moonraker 会自动运行 klipper/install.sh 并重启 klipper。
# 注意: 若本次更新涉及固件源码 (klipper/firmware/ 目录), 需手动重新编译烧录固件。
#
# 注意: primary_branch 需与 GitHub 仓库的默认分支名一致 (main 或 master)。
[update_manager tool_eddy_calibration]
type: git_repo
# origin: https://gitee.com/chengxiaogang/tool_eddy_calibration.git  # 国内
origin: https://github.com/chengxg/tool_eddy_calibration.git
path: ~/tool_eddy_calibration
install_script: klipper/install.sh
managed_services: klipper
primary_branch: main
