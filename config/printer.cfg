[board_pins mcu_pins]
mcu: mcu # stm32h750 V2核心板
aliases:
    # step1-step6支持spi, spi_bus: spi2
    DIR1=PD3, STEP1=PD4, UART1=PD2, EN1=PD6,   # step1  
    DIR2=PC8, STEP2=PC12, UART2=PD0, , EN2=PD1,          # step2
    DIR3=PC9, STEP3=PD8, UART3=PD14, EN3=PB1,  # step3
    DIR4=PC6, STEP4=PD13, UART4=PD12,          # step4 EN与step3共用
    DIR5=PE14, STEP5=PD15, UART5=PD9, EN5=PB2, # step5
    DIR6=PC5, STEP6=PB12, UART6=PB0,           # step6 EN与step5共用
    DIR7=PA5, STEP7=PA6, UART7=PA7, EN7=PC4,   # step7
    DIR8=PA2, STEP8=PA3, UART8=PA1, EN8=PA0,   # step8
    FAN1=PA8, FAN2=PC7, FAN3=PA10, FAN4=PA9,   # FAN1, FAN2支持5V/12V/24V电压切换
    STOP1=PA4, STOP2=PE12,            # 限位 3PIN STOP1,STOP2 支持高压输入,二极管输入隔离,支持12V和24V供电输出,
    STOP3=PE13, STOP4=PE11,           # 限位 2PIN step1,step2无限位归零
    STOP5=PE10, STOP6=PE9,            # 限位 3PIN 5V供电输出
    STOP7=PB7, STOP8=PB6,             # 核心板上, 限位 5V供电输出
    T1=PC0, T2=PC3, T3=PC1, T4=PC2,   # 核心板上, 温控
    H1=PD11, H2=PD10,                 # 加热 H1大功率
    LED=PB4,                          # klipper运行指示 !PB4
    SDA=PB11, SCL=PB10,               # 核心板上, I2C接口 i2c_bus:i2c2
    SHUT=PD7                          # 高电平 自动关机

# [board_pins mcu_pins]
# mcu: mcu     # stm32f446核心板 stm32f446rct6引脚定义
# aliases:
#     DIR1=PB8, STEP1=PB9, UART1=PB7, EN1=PB6,    # step1
#     DIR2=PD2, STEP2=PB4, UART2=PB5,             # step2 EN与 step1共用
#     DIR3=PB3, STEP3=PA13, UART3=PC10, EN3=PB1,  # step3
#     DIR4=PA15, STEP4=PA14, UART4=PC7,           # step4 EN与 step3共用
#     DIR5=PB10, STEP5=PC8, UART5=PC6, EN5=PB2,   # step5
#     DIR6=PC5, STEP6=PB12, UART6=PB0,            # step6 EN与 step5共用
#     DIR7=PA5, STEP7=PA6, UART7=PA7, EN7=PC4,    # step7
#     DIR8=PC2, STEP8=PA3, UART8=PA1, EN8=PA0,    # step8
#     FAN1=PA8, FAN2=PC9, FAN3=PA10, FAN4=PA9,    # 风扇
#     STOP1=PA4, STOP2=PC14, STOP3=PC15, STOP4=PC13, STOP5=PC3, STOP6=PA2, # 限位
#     T1=PC0, T2=PC1,                             # 温控
#     H1=PC12, H2=PC11,                           # 加热
	
# [board_pins mcu2_pins]
# mcu: mcu2      # stm32f446核心板 stm32f072c8t6引脚定义
# aliases:
#     SHUT=PA14,              # 设置高电平 自动关机
#     LED1=PA7,               # klipper运行指示, 低电平亮灯
#     CAN_RX=PB8, CAN_TX=PB9, # can通信引脚
# 	RX=PA10, TX=PA9,        # 串口引脚
#     SDA=PB11, SCL=PB10,     # I2C引脚


# [board_pins toolhead_pins_f072]
# mcu: toolhead # stm32f072串口通信工具头
# aliases:
#     H1=PB14,                                # 加热
#     FAN1=PB8,FAN2=PC13,FAN3=PC14,FAN4=PB7,  # 风扇
#     STOP1=PB6,STOP2=PC15,STOP3=PA3,         # 限位
#     T1=PA1,T2=PA2,T3=PA4,                   # 温控 T3为仓温检测
#     EN1=PB4,DIR1=PA14,STEP1=PA15,UART1=PB3, # tmc2226步进电机驱动
#     LED=PB5, # klipper运行指示灯


[board_pins toolhead_pins_f446]
mcu: toolhead # stm32f446 工具头
aliases:
    H1=PB2,                                                # 加热
    FAN1=PB3,FAN2=PB4,FAN3=PC2,  			                     # 风扇
    STOP1=PD2,STOP2=PB5,STOP3=PA2,                         # 限位 STOP2有二极管隔离
    T1=PB0,T2=PC4,T3=PC5,                                  # 温控 T3为仓温检测
    EN1=PC12,DIR1=PC10,STEP1=PA15,UART1=PA14,DIAG1=PC11,   # tmc2226步进电机驱动
    ADXL_CS=PC6,ADXL_MOSI=PC9,ADXL_MISO=PC8,ADXL_SCK=PC7, ADXL_INT1=PC3,  # ADXL345 软件spi接口
    MAX_DYDY=PA3, MAX_CS=PA4,              # MAX31865 硬件spi spi_bus: spi1
    LDC_SDA=PC0,LDC_SCL=PC1,LDC_INTB=PC13, # LDC1612
    WS2812=PA8, # WS2812
    SCL1=PB6,SDA1=PB7,
    LED=PB1, # klipper运行指示灯 高电平亮灯


