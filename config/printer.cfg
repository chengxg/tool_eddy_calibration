#-------------------------------------------------------------------

[display_status]

[pause_resume]

[force_move]
enable_force_move: true
#####################################################################
#                            机型和加速度                            #
#####################################################################
[printer]                       # 打印机设置
kinematics: corexy               # 运动学结构分为：笛卡尔和corexy等等。笛卡尔：cartesian
max_velocity: 300               # 打印机最大速度   
max_accel: 4400                 # 最大加速度 最大3000
max_z_velocity: 40              # z轴最大速度
max_z_accel: 500                # z轴最大加速度
square_corner_velocity: 20.0     # 方形拐角速度，小一点可以有效避免平台重带来的惯性

#####################################################################
#             X/Y步进电机设置 (X/Y Stepper Settings)                 # 
#####################################################################
#                   z1                 z2
#                       B__________A
#                     
# 
# 
# 
#                   Z0     12864      Z3

#####################################################################
#                  X 轴步进电机      (DRIVER0)                       #
#####################################################################
## DRIVER0电机位置
[stepper_x]
step_pin: STEP1                      
dir_pin: DIR1                        
enable_pin: !EN1

endstop_pin: ^toolhead:STOP2            # 限位开关PIN脚,建议常闭然后添加！反转状态,位置在io-3
rotation_distance: 40               # 主动带轮周长mm（2GT-20T带轮40，2GT-16T带轮32）
microsteps: 16                      # 电机细分设置，细分越高，质量越高，但主控负荷越大
full_steps_per_rotation: 200        # 电机单圈所需脉冲数（1.8度电机:200，0.9度电机:400）
# endstop_pin: PA3                    # 限位开关PIN脚,建议常闭接常闭
#endstop_pin: tmc5160_stepper_x:virtual_endstop        # 限位开关接口
###接常闭后是触发状态，加感叹号可以反转这个状态，万一断线时候可以避免撞机
position_min: 0                     # 软限位最小行程
position_endstop: 0               # 软限位最大行程 (250mm-300mm-350mm)
position_max: 220                   # 机械限位最大行程 (250mm-300mm-350mm)
homing_speed: 60                    # 复位速度-最大 100
homing_retract_dist: 5              # 第一次触发复位开关之后的后退距离
homing_positive_dir: false           # 复位方向（一般不需要改动）
#--------------------------------------------------------------------
##  请确保驱动型号配置正确 (2208 or 2209)
# [tmc2209 stepper_x]                 # x 驱动配置 -TMC2209
# uart_pin: gpio23                       # 通讯端口Pin脚定义
# interpolate: False                  # 是否开启256微步插值（开启是True，关闭是False）
# run_current: 1.2                    # 电机运行电流值（单位：mA）
# sense_resistor: 0.110               # 驱动采样电阻不要改
# stealthchop_threshold: 0          # 静音阀值（如果不需要静音，请将数值改为0）

[tmc5160 stepper_x]                 # x 驱动配置 -TMC2209
cs_pin: UART1                       # 通讯端口Pin脚定义
spi_bus: spi2
# spi_software_sclk_pin:
# spi_software_mosi_pin:
# spi_software_miso_pin:
interpolate: False
run_current: 1.4
stealthchop_threshold: 0          # 静音阀值（如果不需要静音，请将数值改为0）

#####################################################################
#                  Y 轴步进电机      (DRIVER1)                       #
#####################################################################
## DRIVER1电机位置
[stepper_y]
step_pin: STEP2
dir_pin: DIR2
enable_pin: !EN1

endstop_pin: ^STOP6                     # 限位开关PIN脚,建议常闭然后添加！反转状态
rotation_distance: 40
microsteps: 16                      # 电机细分设置，细分越高，质量越高，但主控负荷越大
full_steps_per_rotation: 200        # 电机单圈所需脉冲数（1.8度电机:200，0.9度电机:400）
###接常闭后是触发状态，加感叹号可以反转这个状态，万一断线时候可以避免撞机
position_min: 0
position_endstop: 0
position_max: 230
homing_speed: 60
homing_retract_dist: 5
homing_positive_dir: false
#--------------------------------------------------------------------
#  请确保驱动型号配置正确 (2209 or 5160)
# [tmc2209 stepper_y]
# uart_pin: gpio20
# interpolate: False                  # 是否开启256微步插值（开启是True，关闭是False）
# run_current: 1.2                    # 电机运行电流值（单位：mA）
# sense_resistor: 0.110               # 驱动采样电阻不要改
# stealthchop_threshold: 0          # 静音阀值（如果不需要静音，请将数值改为0）

[tmc5160 stepper_y]                 # x 驱动配置 -TMC2209
cs_pin: UART2                       # 通讯端口Pin脚定义
spi_bus: spi2
# spi_software_sclk_pin:
# spi_software_mosi_pin:
# spi_software_miso_pin:
interpolate: False
run_current: 1.4
stealthchop_threshold: 0          # 静音阀值（如果不需要静音，请将数值改为0）

#####################################################################
#                     Z轴步进电机 （Z Stepper Settings）             #
#####################################################################
## DRIVER2电机位置
[stepper_z]
step_pin: STEP3                           # z轴电机脉冲引脚设置
dir_pin:  !DIR3                           # z轴电机方向引脚设置,方向引脚需要按实际判断，加感叹号会让运行方向反转
enable_pin: !EN3                          # z轴电机使能引脚设置,使能引脚需要加感叹号，否者电机不工作
microsteps: 32                            # 电机细分设置，细分越高，质量越高，但主控负荷越大
rotation_distance: 8                      # 主动带轮周长mm（2GT-20T带轮40，2GT-16T带轮32）
full_steps_per_rotation: 200              # 电机单圈所需脉冲数（1.8度电机:200，0.9度电机:400）
endstop_pin: probe:z_virtual_endstop      #设置Z轴为虚拟限位，使用接近开关需要开启此项
# position_endstop: 0		                  # 限位的位置，使用接近开关无需开启此项
position_min: -8                          # （配置喷嘴清洁需要-5左右）
position_max: 200                         # 机械限位最大行程 (250mm-300mm-350mm)
homing_speed: 10                           # 复位速度-最大 20
second_homing_speed: 10                    # 二次复位速度-最大 10
homing_retract_dist: 0                    # 后撤距离

#--------------------------------------------------------------------
[tmc2209 stepper_z]
uart_pin: UART3
interpolate: false
run_current: 1
sense_resistor: 0.110
stealthchop_threshold: 0
hold_current: 0.2    
##--------------------------------------------------------------------
[stepper_z1]
step_pin: STEP4
dir_pin:  !DIR4
enable_pin: !EN3
microsteps: 32                      # 电机细分设置，细分越高，质量越高，但主控负荷越大
rotation_distance: 8               # 主动带轮周长mm（2GT-20T带轮40，2GT-16T带轮32）
full_steps_per_rotation: 200        # 电机单圈所需脉冲数（1.8度电机:200，0.9度电机:400）
[tmc2209 stepper_z1]
uart_pin: UART4
interpolate: false
run_current: 1
sense_resistor: 0.110
stealthchop_threshold: 0    
hold_current: 0.2
#--------------------------------------------------------------------
[stepper_z2]
step_pin: STEP5
dir_pin: !DIR5
enable_pin: !EN5
microsteps: 32                      # 电机细分设置，细分越高，质量越高，但主控负荷越大
rotation_distance: 8               # 主动带轮周长mm（2GT-20T带轮40，2GT-16T带轮32）
full_steps_per_rotation: 200        # 电机单圈所需脉冲数（1.8度电机:200，0.9度电机:400）
[tmc2209 stepper_z2]
uart_pin: UART5
interpolate: false
run_current: 1
sense_resistor: 0.110
stealthchop_threshold: 0
hold_current: 0.2
##--------------------------------------------------------------------
[stepper_z3]
step_pin: STEP6
dir_pin: !DIR6
enable_pin: !EN5
microsteps: 32                      # 电机细分设置，细分越高，质量越高，但主控负荷越大
rotation_distance: 8               # 主动带轮周长mm（2GT-20T带轮40，2GT-16T带轮32）
full_steps_per_rotation: 200        # 电机单圈所需脉冲数（1.8度电机:200，0.9度电机:400）
[tmc2209 stepper_z3]
uart_pin: UART6
interpolate: False
run_current: 1
sense_resistor: 0.110
stealthchop_threshold: 0
hold_current: 0.2

#####################################################################
#                            热床配置
#####################################################################
[heater_bed]
# heater_pin: rp2040_e:gpio14
# sensor_pin: rp2040_e:gpio26              # 热床传感器接口
heater_pin: FAN3
sensor_pin: T1              # 热床传感器接口

sensor_type: Generic 3950    # 热床传感器类型
max_power: 0.7               # 热床功率
min_temp: -200               # 热床最小温度
max_temp: 110                # 热床最大温度
# 热床温度PID校准命令：  "PID_CALIBRATE HEATER=heater_bed TARGET=100"
control: pid
pid_kp: 58.437
pid_ki: 2.347
pid_kd: 363.769
[controller_fan 主板散热]
pin: FAN4
stepper: stepper_z,stepper_x,stepper_y
fan_speed: 1.0

[controller_fan 热端风扇T0]
pin: FAN1
stepper: stepper_z,stepper_x,stepper_y
fan_speed: 1.0

[controller_fan 热端风扇T1]
pin: FAN2
stepper: stepper_z,stepper_x,stepper_y
fan_speed: 1.0


