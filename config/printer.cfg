enable_pin: !toolhead:EN1               # 挤出电机方使能引脚设置
## 执行挤出机校准时，更新以下值
## 比如你要求100毫米的进料，但实际上是102：
## rotation_distance = <旧rotation_distance> * <实际挤出长度> / <请求的挤出长度>
## 校准步进值: 22.44=旧值22*实际值102/目标值100
rotation_distance: 55               # 步进值
gear_ratio: 44:10, 37:17            # 减速比（伽利略齿比7.5:1 并且这行注释掉；BMG为50：17，输出轴在前，输入轴在后）
microsteps: 32                      # 电机细分设置,细分越高，质量越高，但主控负荷越大
# rotation_distance: 4.637            # 伽利略挤出机步进值
# rotation_distance: 5.7            # hgx挤出机步进值
