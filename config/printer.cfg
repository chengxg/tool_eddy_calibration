[gcode_macro CLEAN_NOZZLE]
gcode:
  {% set wipe_count = 8 %}
  G1 Z2 F300
  G1 X20 Y26 F3600
  # SET_Z_FROM_PROBE METHOD=tap
  G1 Z-0.1 F300
  {% for wipe in range(wipe_count) %}
    {% for coordinate in [(20, 26),(2, 26)] %}
      G0 X{coordinate[0]} Y{coordinate[1]} F2000
    {% endfor %}
  {% endfor %}
  G1 Z2 F300


[gcode_macro PRINT_START]          # 将 PRINT_START 设置为开始打印时的宏，自定义打印前的动作
description: 打印开始宏（包含：归零、调平、按各材料独立温度加热、智能排序划线）
gcode:
    # ==========================================
    # 1. 接收切片软件传来的参数
    # ==========================================
    {% set BED_TEMP = params.BED|default(60)|float %}            
    
    # 重点：接收初始喷头编号，并转为字符串方便后面比对
    {% set INITIAL_TOOL = params.INITIAL_TOOL|default("0")|string %} 
    
    {% set tools_str = params.TOOLS|default("0,")|string %}
    {% set tool_list = tools_str.split(',') %}
    {% set temps_str = params.TEMPS|default("200,")|string %}
    {% set temp_list = temps_str.split(',') %}

    {% set start_x = 5.0 %}
    {% set start_y = 35.0 %}
    {% set offset_y = 2.0 %}
    {% set prime_length = 180.0 %}
    {% set pre_extrude = 5.0 %}

    BED_MESH_CLEAR                 # 卸载网床
    G21 ; set units to millimeters
    G90 ; use absolute coordinates  
    G28                            # 归位所有轴
    G1 Z2 F400
    G1 X20 Y26 F2000
    G92 E0                         # 重置挤出
    M107                           # 风扇关闭

    M190 S{params.BED}            # 热床到指定温度
    M109 S150 T0     # 第一个头加热到150度
    G28 Z F400
    T0               # 加载第一个头
    Z_TILT_ADJUST    # 自动调平
    
    G1 X20 Y35 F2000
    SET_Z_FROM_PROBE METHOD=tap
    CLEAN_NOZZLE
    G1 X20 Y35 F2000
    SET_Z_FROM_PROBE METHOD=tap
    SET_Z_FROM_PROBE METHOD=tap

    ;判断是否有自适应网床参数
    {% if params.MESH_MIN %}
      ; 此处接收来自Orca的自适应网床参数，需要软件中配置传参
      BED_MESH_CALIBRATE PROFILE=default mesh_min={params.MESH_MIN} mesh_max={params.MESH_MAX} ALGORITHM={params.MESH_ALGO} PROBE_COUNT={params.PROBE_COUNT} ADAPTIVE=1 ADAPTIVE_MARGIN=0
    {% else %}
      BED_MESH_CALIBRATE PROFILE=default ADAPTIVE=1 ADAPTIVE_MARGIN=0      ; 每次探测网床
    {% endif %}
    BED_MESH_PROFILE LOAD=default ; 可选调用默认网床
    M109 S{params.EXTRUDER}       #喷嘴温度到打印温度

    # ==========================================
    # 3. 按独立温度加热所有【用到】的喷头
    # ==========================================
    {% for i in range(tool_list|length) %}
        {% if tool_list[i] != "" and temp_list[i] != "" %}
            M104 S{temp_list[i]} T{tool_list[i]}
        {% endif %}
    {% endfor %}

    {% for i in range(tool_list|length) %}
        {% if tool_list[i] != "" and temp_list[i] != "" %}
            M109 S{temp_list[i]} T{tool_list[i]}
        {% endif %}
    {% endfor %}

    # ==========================================
    # 4. 依次切换喷头并进行边缘划线
    # ==========================================
    SAVE_GCODE_STATE NAME=print_start_state
    G90 
    G92 E0 

    {% set ns = namespace(line_index=0) %}

    # ----- 第 1 步：先给【非初始头】划线 -----
    {% for tool in tool_list %}
        # 只要不是空值，且【不是初始头】，就先给它划线
        {% if tool != "" and tool != INITIAL_TOOL %}
            T{tool}
            {% set current_y = start_y + (ns.line_index * offset_y) %}
            G1 Z5.0 F500
            G1 X{start_x} Y{current_y} F6000
            G1 Z0.28 F500
            G91 
            G1 E{pre_extrude} F300 
            G1 X{prime_length * 0.6} E{prime_length * 0.15} F1000 
            G1 X{prime_length * 0.4} E{prime_length * 0.1} F1500 
            G1 E-1.5 F2100 
            G1 Z2.0 F500
            G90
            G92 E0
            # M104 S0 T{tool}
            {% set ns.line_index = ns.line_index + 1 %}
        {% endif %}
    {% endfor %}

    # ----- 第 2 步：最后给【初始头】划线 -----
    # 确保切片传来的初始头确实在用到的列表里，然后最后拿起它划线
    {% if INITIAL_TOOL in tool_list %}
        T{INITIAL_TOOL}
        {% set current_y = start_y + (ns.line_index * offset_y) %}
        G1 Z5.0 F500
        G1 X{start_x} Y{current_y} F6000
        G1 Z0.28 F500
        G91 
        G1 E{pre_extrude} F300 
        G1 X{prime_length * 0.6} E{prime_length * 0.12} F1000 
        G1 X{prime_length * 0.4} E{prime_length * 0.1} F1500 
        G1 E0 F2100 
        G1 Z2.0 F500
        G90
        G92 E0
        # 这里划完线之后，机器正好拿的就是初始头！
    {% endif %}

   # ==========================================
    # 5. 恢复状态，交给切片软件接管（修复首层错层 Bug）
    # ==========================================
    RESTORE_GCODE_STATE NAME=print_start_state
    
    {% if INITIAL_TOOL in tool_list %}
        {% set svv = printer.save_variables.variables %}
        {% set off_x = svv["t" ~ INITIAL_TOOL ~ "_offset_x"] | default(0.0) | float %}
        {% set off_y = svv["t" ~ INITIAL_TOOL ~ "_offset_y"] | default(0.0) | float %}
        {% set off_z = svv["t" ~ INITIAL_TOOL ~ "_offset_z"] | default(0.0) | float %}
        
        SET_GCODE_OFFSET X={off_x} Y={off_y} Z={off_z} MOVE=0
        
        { action_respond_info("初始头 T" ~ INITIAL_TOOL ~ " 已从外部文件应用偏移。") }
    {% endif %}


    { action_respond_info("划线结束。目前喷头为 T" ~ INITIAL_TOOL ~ "，已重新加载坐标偏移，准备直接打印！") }

